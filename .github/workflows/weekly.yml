name: Weekly picks

on:
  schedule:
    # Mondays at 04:17 UTC, before the morning in Europe
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build this week's pool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly.mjs
      - name: Save it
        run: |
          git config user.name "sift-bot"
          git config user.email "sift-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly pool $(date -u +%G-W%V)"
          git push
