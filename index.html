<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sift</title>
<meta name="description" content="Five design and AI reads a week, chosen for where you are going.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sift">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCFAF8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<link rel="stylesheet" href="design-system/tokens.css?v=2">
<style>
/* Colours, type and sizes come from design-system/tokens.css. Only app values live here. */
:root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); }
body { font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; }
a { color: var(--blue-text); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.screen { min-height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(var(--top) + var(--st)) var(--gutter) calc(32px + var(--sb)); }
.screen.flow { padding-top: calc(56px + var(--st)); }
.screen.tabs { padding-bottom: calc(var(--size-nav) + 32px + var(--sb)); }
.grow { flex-grow: 1; }
h1 { margin: 0; color: var(--ink); }
.sub { margin: 6px 0 0; color: var(--muted); }
.lead-line { margin: 8px 0 0; color: var(--muted); }

.topbar { height: var(--size-round); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.round { width: var(--size-round); height: var(--size-round); border-radius: var(--radius-pill); background: var(--chip); color: var(--ink); display: flex; align-items: center; justify-content: center; border: 0; text-decoration: none; cursor: pointer; flex-shrink: 0; }

.picks { margin-top: 16px; display: flex; flex-direction: column; }
.pickrow { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; padding: var(--row-pad) 0; border-bottom: 1px solid var(--line); }
.pickrow:last-child { border-bottom: 0; }
.pickrow .body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; color: var(--muted); }
.pickrow.read .t { color: var(--muted); }
.tagp { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: var(--radius-pill); background: var(--chip); color: var(--tag-text); }
.end { margin: 24px 0 0; text-align: center; color: var(--muted); }
.note { margin: 12px 0 0; padding: 12px 14px; border-radius: var(--radius-field); background: var(--tint); color: var(--tag-text); }
.tinted { padding: 18px 20px 20px; border-radius: var(--radius-block); background: var(--tint); }
.gistline { margin: 16px 0 0; padding: 16px 20px; border-radius: var(--radius-block); background: var(--tint); color: var(--ink); }
.pickrow { align-items: flex-start; }
.pickrow .chev { margin-top: 4px; }
.pickrow .g { color: var(--muted); }
.pickrow.read .g { color: var(--muted); }
.srclink { color: var(--blue-text); text-decoration: none; display: inline-flex; align-items: center; gap: 2px; }
.points.full { list-style: none; padding: 0; gap: 24px; margin-top: 12px; }
.points.full h3 { margin: 0 0 6px; font-weight: 500; }
.points.full p { margin: 0; }
.orig { margin: 16px auto 0; padding: 12px; color: var(--blue-text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

.btn { height: var(--size-button); flex-shrink: 0; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; width: 100%; }
.btn.primary { background: var(--primary); color: #fff; border: 0; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); font-weight: 400; }
.btn[disabled] { opacity: .4; cursor: default; }
.stack { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-4); }

.options { margin-top: 20px; display: flex; flex-direction: column; }
.opt { all: unset; min-height: var(--size-option); padding: 10px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.opt .body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.opt[aria-checked="true"] .name { font-weight: 500; }
.seg { height: 44px; border-radius: var(--radius-pill); background: var(--chip); padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.seg button { border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 500; }
.label { display: block; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 10px; }
.chipb { height: var(--size-chip); padding: 0 14px 0 10px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
.chipb[aria-pressed="true"] { background: var(--soft); border-color: var(--soft); color: var(--blue-text); font-weight: 500; }
.field { margin-top: 10px; height: 48px; width: 100%; border-radius: var(--radius-field); border: 1px solid var(--border); background: var(--surface); padding: 0 16px; font-size: 17px; color: var(--ink); }

.section { margin-top: var(--space-4); }
.section h2 { margin: 0; color: var(--muted); font-weight: 500; }
.section h2.blue { color: var(--blue-text); }
.section p { margin: 8px 0 0; }
.points { margin: 8px 0 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 10px; }
.hair { height: 1px; background: var(--line); margin-top: var(--space-4); }

.rows { margin-top: 12px; display: flex; flex-direction: column; }
.row { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; cursor: pointer; font: inherit; }
.row:last-child { border-bottom: 0; }
.row .body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .val { color: var(--muted); }
.danger { margin: 32px auto 0; background: none; border: 0; color: var(--danger); cursor: pointer; padding: 12px; }

nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); padding-bottom: var(--sb); z-index: 10; }
nav.tabbar .in { max-width: 560px; margin: 0 auto; height: var(--size-nav); padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; }
nav.tabbar a { width: 96px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; }
nav.tabbar a[aria-current="page"] { color: var(--blue-text); font-weight: 500; }

.welcome .mark { color: var(--primary); font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.2px; }
.welcome h1 { margin-top: 20px; }
.welcome p { margin: 16px 0 0; color: var(--muted); }
.loading { color: var(--muted); padding: 120px 28px; text-align: center; }
</style>
</head>
<body>
<main id="app"><p class="loading small">Loading this week</p></main>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

<script type="module">
import { pickFive, recommendTopics } from './pick.js?v=2'

const ICON = {
  back: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 5l7 7-7 7"/></svg>',
  read: '<svg role="img" aria-label="Read" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  try: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5l13 7-5.5 1.8L11 19.5z"/></svg>',
  know: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>',
  on: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" style="flex-shrink:0"><circle cx="12" cy="12" r="11" fill="var(--primary)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  off: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" style="flex-shrink:0"><circle cx="12" cy="12" r="10.5" fill="none" stroke="var(--ring)" stroke-width="1.5"/></svg>',
  check: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  ext: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  week: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  past: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>',
  gear: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
}
const YEARS = [['under3', 'Under 3'], ['3to8', '3 to 8'], ['over8', 'Over 8']]

// Saved on the phone. Wrapped so a private window or a full disk never breaks the app.
const KEY = 'sift.v1'
let state = { user: null, read: {}, picks: {} }
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY) || '{}') } } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch {} }

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const app = document.getElementById('app')
const tabbar = document.getElementById('tabbar')
let meta, index, latest
const weeks = {}
let draft = null

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-cache' })
  if (!res.ok) throw new Error(url)
  return res.json()
}
async function loadWeek(id) {
  if (id === 'latest' || id === latest.week) return latest
  if (!weeks[id]) weeks[id] = await getJSON(`data/weeks/${id}.json`)
  return weeks[id]
}

// Dates
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
function weekRange(pool) {
  if (pool.sample) return 'Sample week'
  const start = new Date(pool.created)
  const day = (start.getUTCDay() + 6) % 7
  start.setUTCDate(start.getUTCDate() - day)
  const end = new Date(start); end.setUTCDate(start.getUTCDate() + 6)
  const a = `${MONTHS[start.getUTCMonth()]} ${start.getUTCDate()}`
  const b = start.getUTCMonth() === end.getUTCMonth() ? `${end.getUTCDate()}` : `${MONTHS[end.getUTCMonth()]} ${end.getUTCDate()}`
  return `${a} to ${b}`
}

function picksFor(pool) {
  if (!state.picks[pool.week]) { state.picks[pool.week] = pickFive(pool, state.user, meta); save() }
  return state.picks[pool.week]
}
const isRead = (week, id) => !!state.read[week]?.[id]
const readCount = (pool) => picksFor(pool).filter((p) => isRead(pool.week, p.id)).length
function setRead(week, id, on) {
  state.read[week] = state.read[week] || {}
  if (on) state.read[week][id] = true; else delete state.read[week][id]
  save()
}

function tabs(current) {
  if (!current) { tabbar.hidden = true; return }
  tabbar.hidden = false
  const t = (href, key, label, icon) => `<a href="${href}" class="tab"${current === key ? ' aria-current="page"' : ''}>${icon}${label}</a>`
  tabbar.innerHTML = `<div class="in">${t('#/week', 'week', 'This week', ICON.week)}${t('#/past', 'past', 'Past weeks', ICON.past)}${t('#/settings', 'settings', 'Settings', ICON.gear)}</div>`
}
const tag = (kind) => `<span class="tagp tag">${kind === 'try' ? ICON.try + 'Try it' : ICON.know + 'Know it'}</span>`

// Screens
function viewWelcome() {
  tabs(null)
  app.innerHTML = `<div class="screen welcome">
    <div class="grow"></div>
    <span class="mark">Sift</span>
    <h1 class="hero">Five picks a week, chosen for where you are going</h1>
    <p class="body">Sift reads the design and AI sources worth trusting, then picks what matters for your work. When you finish the five, you are done for the week.</p>
    <div class="grow"></div>
    <a class="btn primary button" href="#/role">Get started</a>
  </div>`
}

function startDraft() {
  if (!draft) draft = state.user ? JSON.parse(JSON.stringify(state.user)) : { role: null, years: null, goal: null, topics: null, keywords: [] }
}
function step(n, back, edit) {
  return `<div class="topbar"><a class="round" href="${back}" aria-label="Back">${ICON.back}</a>${edit ? '' : `<span class="small" style="color:var(--muted)">Step ${n} of 3</span>`}</div>`
}
function optionList(items, value, name) {
  return `<div class="options" role="radiogroup" aria-label="${name}">${items.map((it) => `<button type="button" class="opt" role="radio" data-v="${it.id}" aria-checked="${it.id === value}"><span class="body"><span class="name pick">${esc(it.name)}</span>${it.hint ? `<span class="small" style="color:var(--muted)">${esc(it.hint)}</span>` : ''}</span>${it.id === value ? ICON.on : ICON.off}</button>`).join('')}</div>`
}
function wireOptions(onPick) {
  app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => onPick(b.dataset.v)))
}

function viewRole(edit) {
  startDraft(); tabs(null)
  app.innerHTML = `<div class="screen flow">
    ${step(1, edit ? '#/settings' : '#/start', edit)}
    <h1 class="title" style="margin-top:32px">What do you do?</h1>
    <p class="lead-line lead">Your role sets which kinds of reads come first.</p>
    ${optionList(meta.roles, draft.role, 'Role')}
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:10px">
      <span class="label small" id="yl">Years in the field</span>
      <div class="seg lead" role="radiogroup" aria-labelledby="yl">${YEARS.map(([v, l]) => `<button type="button" role="radio" data-y="${v}" aria-checked="${draft.years === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="grow" style="min-height:32px"></div>
    ${draft.role ? `<a class="btn primary button" href="${edit ? '#/settings' : '#/goal'}" id="next">${edit ? 'Save' : 'Continue'}</a>` : '<button class="btn primary button" disabled>Continue</button>'}
  </div>`
  wireOptions((v) => { if (draft.role !== v && !edit) draft.topics = null; draft.role = v; viewRole(edit) })
  app.querySelectorAll('[data-y]').forEach((b) => b.addEventListener('click', () => { draft.years = b.dataset.y; viewRole(edit) }))
  if (edit && draft.role) document.getElementById('next').addEventListener('click', commit)
}

function viewGoal(edit) {
  startDraft(); tabs(null)
  app.innerHTML = `<div class="screen flow">
    ${step(2, edit ? '#/settings' : '#/role', edit)}
    <h1 class="title" style="margin-top:32px">Where do you want to go?</h1>
    <p class="lead-line lead">Sift leans toward what you will need next, not only what you do today.</p>
    ${optionList(meta.goals, draft.goal, 'Goal')}
    <div class="grow" style="min-height:32px"></div>
    ${draft.goal ? `<a class="btn primary button" href="${edit ? '#/settings' : '#/topics'}" id="next">${edit ? 'Save' : 'Continue'}</a>` : '<button class="btn primary button" disabled>Continue</button>'}
  </div>`
  wireOptions((v) => { if (draft.goal !== v && !edit) draft.topics = null; draft.goal = v; viewGoal(edit) })
  if (edit && draft.goal) document.getElementById('next').addEventListener('click', commit)
}

function viewTopics(edit) {
  startDraft(); tabs(null)
  if (!draft.goal) { location.hash = '#/goal'; return }
  if (!draft.topics) draft.topics = recommendTopics(meta, draft.role, draft.goal)
  const ROLE = { designer: 'product designer', pm: 'product manager', researcher: 'UX researcher', lead: 'design or product lead' }
  const GOAL = { grow: 'growing in their role', ai: 'moving into AI product design', lead: 'stepping up to lead a team' }
  const who = ROLE[draft.role] ? `${draft.years === 'over8' ? 'senior ' : ''}${ROLE[draft.role]}` : 'you'
  const intro = `Picked for ${who === 'you' ? 'you' : 'a ' + who}${GOAL[draft.goal] ? ' ' + GOAL[draft.goal] : ''}. Change anything.`
  const chip = (t, on) => `<button type="button" class="chipb lead" aria-pressed="${on}" data-t="${t.id}">${on ? ICON.check : ICON.plus}${esc(t.name)}</button>`
  const chosen = draft.topics.map((id) => meta.topics.find((t) => t.id === id)).filter(Boolean)
  const others = meta.topics.filter((t) => !draft.topics.includes(t.id))
  app.innerHTML = `<div class="screen flow">
    ${step(3, edit ? '#/settings' : '#/goal', edit)}
    <h1 class="title" style="margin-top:32px">Your topics</h1>
    <p class="lead-line lead">${edit ? 'Three picks a week come from these. Change anything.' : esc(intro)}</p>
    <div class="chips" role="group" aria-label="Your topics">${chosen.map((t) => chip(t, true)).join('')}</div>
    <span class="label small" style="margin-top:24px">More to add</span>
    <div class="chips" role="group" aria-label="More topics">${others.map((t) => chip(t, false)).join('')}</div>
    <label class="label small" for="kw" style="margin-top:24px">Your own keywords</label>
    <input class="field" id="kw" type="text" autocomplete="off" placeholder="Like checkout or loyalty" value="${esc((draft.keywords || []).join(', '))}">
    <div class="grow" style="min-height:32px"></div>
    <button type="button" class="btn primary button" id="done"${draft.topics.length ? '' : ' disabled'}>${edit ? 'Save' : 'Start my first week'}</button>
  </div>`
  const kw = document.getElementById('kw')
  const keepKw = () => { draft.keywords = kw.value.split(',').map((s) => s.trim()).filter(Boolean) }
  app.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
    keepKw()
    const id = b.dataset.t
    draft.topics = draft.topics.includes(id) ? draft.topics.filter((t) => t !== id) : [...draft.topics, id]
    viewTopics(edit)
    app.querySelector(`[data-t="${id}"]`)?.focus()
  }))
  document.getElementById('done').addEventListener('click', () => { keepKw(); commit(); location.hash = edit ? '#/settings' : '#/week' })
}

// Saving settings picks the current week again. Past weeks keep their picks.
function commit() {
  state.user = draft
  draft = null
  delete state.picks[latest.week]
  save()
}

function pickRows(pool, base) {
  return picksFor(pool).map((p) => {
    const it = pool.items.find((i) => i.id === p.id)
    if (!it) return ''
    const read = isRead(pool.week, p.id)
    return `<a class="pickrow${read ? ' read' : ''}" href="${base}/${encodeURIComponent(p.id)}"><span class="body"><span class="meta"><span class="small">${esc(p.label)} · ${esc(it.source)}</span>${tag(it.kind)}</span><span class="t pick">${esc(it.title)}</span>${it.gist ? `<span class="g lead">${esc(it.gist)}</span>` : ''}</span><span class="chev">${read ? ICON.read : ICON.chev}</span></a>`
  }).join('')
}

async function viewWeek(id) {
  const pool = await loadWeek(id || 'latest')
  const past = !!id && pool !== latest
  tabs(past ? 'past' : 'week')
  const picks = picksFor(pool)
  const n = readCount(pool)
  const done = n === picks.length && picks.length > 0
  app.innerHTML = `<div class="screen tabs">
    ${past ? `<div class="topbar" style="margin:-8px 0 20px"><a class="round" href="#/past" aria-label="Back to past weeks">${ICON.back}</a></div>` : ''}
    <h1 class="title">${past ? esc(weekRange(pool)) : 'This week'}</h1>
    <p class="sub small">${past ? '' : `${esc(weekRange(pool))} · `}${n} of ${picks.length} read</p>
    ${pool.sample && !past ? '<p class="note small">These are sample picks from real articles. Your first real week arrives after the Monday run.</p>' : ''}
    ${pool.brief ? `<section class="section tinted" style="margin-top:24px"><h2 class="small blue">The week in short</h2><p class="body">${esc(pool.brief)}</p></section><h2 class="small" style="margin:28px 0 0;color:var(--muted);font-weight:500">Your five</h2>` : ''}
    <div class="picks"${pool.brief ? ' style="margin-top:4px"' : ''}>${pickRows(pool, past ? `#/past/${pool.week}` : '#/item')}</div>
    <p class="end small">${done ? 'All five read. See you on Monday.' : past ? 'That was the week.' : 'That\'s all for this week. New picks on Monday.'}</p>
  </div>`
}

async function viewItem(weekId, itemId) {
  const pool = await loadWeek(weekId)
  const past = pool !== latest
  const p = picksFor(pool).find((x) => x.id === itemId)
  const it = pool.items.find((i) => i.id === itemId)
  const back = past ? `#/past/${pool.week}` : '#/week'
  if (!p || !it) { location.hash = back; return }
  tabs(null)
  const read = isRead(pool.week, it.id)
  const story = it.detail?.points?.length
    ? `<section class="section"><h2 class="small">The full story</h2><div class="points full">${it.detail.points.map((pt) => `<div><h3 class="pick">${esc(pt.head)}</h3><p class="body">${esc(pt.text)}</p></div>`).join('')}</div></section>`
    : `<section class="section"><h2 class="small">In short</h2><ul class="points body">${it.summary.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>`
  app.innerHTML = `<div class="screen flow">
    <a class="round" href="${back}" aria-label="Back">${ICON.back}</a>
    <div class="meta" style="margin-top:28px"><span class="small">${esc(p.label)} · <a class="srclink" href="${esc(it.url)}" target="_blank" rel="noopener" data-open>${esc(it.source)}${ICON.ext}<span class="sr">, opens the original</span></a></span>${tag(it.kind)}</div>
    <h1 class="title" style="margin-top:10px">${esc(it.title)}</h1>
    ${it.mentions > 1 ? `<p class="sub small">Covered by ${it.mentions} sources this week</p>` : ''}
    ${it.gist ? `<p class="gistline body">${esc(it.gist)}</p>` : ''}
    ${p.why ? `<section class="section"><h2 class="small blue">Why you</h2><p class="body">${esc(p.why)}</p></section>` : ''}
    <div class="hair"></div>
    ${story}
    ${it.detail?.takeaway ? `<div class="hair"></div><section class="section"><h2 class="small blue">What you can do</h2><p class="body">${esc(it.detail.takeaway)}</p></section>` : ''}
    <div class="grow" style="min-height:40px"></div>
    <button type="button" class="btn ${read ? 'secondary' : 'primary'} button" id="mark">${read ? 'Mark as unread' : 'Done reading'}</button>
    <a class="orig lead" href="${esc(it.url)}" target="_blank" rel="noopener" data-open>Read the original on ${esc(it.source)}${ICON.ext}</a>
  </div>`
  app.querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', () => setRead(pool.week, it.id, true)))
  document.getElementById('mark').addEventListener('click', () => { setRead(pool.week, it.id, !read); location.hash = back })
}

async function viewPast() {
  tabs('past')
  const ids = (index.weeks || []).filter((w) => w !== latest.week)
  const pools = []
  for (const w of ids) { try { pools.push(await loadWeek(w)) } catch {} }
  app.innerHTML = `<div class="screen tabs">
    <h1 class="title">Past weeks</h1>
    ${pools.length ? `<div class="rows">${pools.map((pl) => `<a class="row" href="#/past/${pl.week}"><span class="body"><span class="pick">${esc(weekRange(pl))}</span><span class="small val">${readCount(pl)} of ${picksFor(pl).length} read</span></span>${ICON.chev}</a>`).join('')}</div>`
      : '<p class="sub lead" style="margin-top:12px">Your past weeks show here once a new week arrives. Each one keeps its five picks.</p>'}
  </div>`
}

function viewSettings() {
  tabs('settings')
  draft = null
  const u = state.user
  const role = meta.roles.find((r) => r.id === u.role)?.name
  const years = YEARS.find(([v]) => v === u.years)?.[1]
  const roleLine = years ? `${role}, ${years.toLowerCase()} years` : role
  const goal = meta.goals.find((g) => g.id === u.goal)?.name
  const topics = u.topics.map((id) => meta.topics.find((t) => t.id === id)?.name).filter(Boolean)
  const row = (href, name, val) => `<a class="row" href="${href}"><span class="body"><span class="pick">${name}</span><span class="small val">${esc(val)}</span></span>${ICON.chev}</a>`
  app.innerHTML = `<div class="screen tabs">
    <h1 class="title">Settings</h1>
    <div class="rows">
      ${row('#/role/edit', 'Role', roleLine)}
      ${row('#/goal/edit', 'Goal', goal)}
      ${row('#/topics/edit', 'Topics', topics.length + ' topics' + (u.keywords?.length ? `, ${u.keywords.length} keyword${u.keywords.length > 1 ? 's' : ''}` : ''))}
    </div>
    <section class="section"><h2 class="small">How Sift picks</h2>
      <p class="body">Every Monday Sift reads 13 trusted sources, merges stories that several of them cover and has AI summarise each one. On your phone it then picks five for you. Three from your topics, the one big story of the week, and one from outside your topics so your reading does not narrow over time.</p>
      <p class="small" style="color:var(--muted)">Summaries are a guide. The article is always the source.</p>
    </section>
    <div class="rows" style="margin-top:20px">
      <a class="row" href="design-system/"><span class="body"><span class="pick">Design system</span></span>${ICON.chev}</a>
      <a class="row" href="https://github.com/yeochoi/sift" target="_blank" rel="noopener"><span class="body"><span class="pick">Sources and code</span></span>${ICON.chev}</a>
    </div>
    <button type="button" class="danger button" id="reset">Start over</button>
  </div>`
  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Start over? Your settings and read marks on this phone are removed.')) return
    state = { user: null, read: {}, picks: {} }; save(); location.hash = '#/start'
  })
}

async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent)
  const [a, b, c] = parts
  window.scrollTo(0, 0)
  try {
    if (!state.user && !['start', 'role', 'goal', 'topics'].includes(a)) { location.hash = '#/start'; return }
    if (a === 'start') return viewWelcome()
    if (a === 'role') return viewRole(b === 'edit')
    if (a === 'goal') return viewGoal(b === 'edit')
    if (a === 'topics') return viewTopics(b === 'edit')
    if (a === 'item' && b) return viewItem('latest', b)
    if (a === 'past' && b && c) return viewItem(b, c)
    if (a === 'past' && b) return viewWeek(b)
    if (a === 'past') return viewPast()
    if (a === 'settings') return viewSettings()
    return viewWeek()
  } catch (e) {
    console.error(e)
    tabs(null)
    app.innerHTML = '<div class="screen"><h1 class="title">Could not load this week</h1><p class="sub lead">Check the connection and try again.</p><div class="grow"></div><button class="btn primary button" onclick="location.reload()">Try again</button></div>'
  }
}

async function boot() {
  try {
    ;[meta, index, latest] = await Promise.all([getJSON('data/topics.json'), getJSON('data/index.json'), getJSON('data/latest.json')])
  } catch (e) {
    app.innerHTML = '<div class="screen"><h1 class="title">Could not load Sift</h1><p class="sub lead">Check the connection and try again.</p><div class="grow"></div><button class="btn primary button" onclick="location.reload()">Try again</button></div>'
    return
  }
  addEventListener('hashchange', route)
  route()
}
boot()
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js')
</script>
</body>
</html>
